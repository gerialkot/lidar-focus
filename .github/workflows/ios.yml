name: iOS build

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen telepítése
        run: brew install xcodegen

      - name: Xcode projekt generálása
        working-directory: ios
        run: xcodegen generate

      - name: Fordítás (aláírás nélkül, a Sideloadly írja alá)
        working-directory: ios
        run: |
          xcodebuild -project LiDARFocus.xcodeproj -target LiDARFocus \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: IPA csomagolása
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/LiDARFocus.app Payload/
          zip -qry LiDARFocus.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LiDARFocus-ipa
          path: ios/LiDARFocus.ipa
